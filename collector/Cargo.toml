[package]
name = "agent-monitor-collector"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
ctrlc = "3.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation","Win32_Security","Win32_Security_Authorization","Win32_Storage_FileSystem","Win32_System_Threading","Win32_System_JobObjects","Win32_System_Memory"] }
