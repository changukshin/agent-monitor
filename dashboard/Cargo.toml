[package]
name = "agent-monitor-dashboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation","Win32_Graphics_Gdi","Win32_System_LibraryLoader","Win32_UI_WindowsAndMessaging","Win32_UI_Controls"] }
windows = { version = "0.61", features = ["Data_Xml_Dom","UI_Notifications"] }
