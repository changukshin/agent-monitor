name: Rust CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Select pinned Rust
        run: rustup override set 1.100.0
      - name: Test
        run: cargo test --workspace --locked --all-targets
      - name: Release build
        run: cargo build --workspace --locked --release
      - name: Assemble Windows distribution
        if: runner.os == 'Windows'
        run: python packaging/build.py dist
      - name: Verify per-user setup and preservation
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Expand-Archive dist/agent-monitor-0.1.0-windows-x64.zip "$env:RUNNER_TEMP/candidate"
          ./packaging/test-setup.ps1 -Package "$env:RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: agent-monitor-0.1.0-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
